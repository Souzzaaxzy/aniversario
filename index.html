<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Uma cartinha especial guarda o seu presente." />
  <title>seu presente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- biblioteca de símbolos reutilizáveis -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <!-- estrela de quatro pontas: pontas verticais mais longas que as horizontais -->
      <symbol id="star4" viewBox="0 0 24 32">
        <path d="M12 0 Q12.6 15.4 24 16 Q12.6 16.6 12 32 Q11.4 16.6 0 16 Q11.4 15.4 12 0 Z" />
      </symbol>
    </defs>
  </svg>

  <main class="stage" id="stage">

    <!-- ornamento superior -->
    <div class="ornament ornament--top" aria-hidden="true">
      <span class="ornament__line"></span>
      <svg class="ornament__star" viewBox="0 0 24 32"><use href="#star4" /></svg>
      <span class="ornament__dot"></span>
    </div>

    <!-- cena principal -->
    <div class="scene" id="scene">
      <div class="glow" aria-hidden="true"></div>
      <div class="deco-field" id="decoField" aria-hidden="true"></div>

      <button class="letter" id="letter" type="button" aria-label="Toque na carta para abrir seu presente">
        <svg class="letter__svg" viewBox="60 25 500 385" role="img" aria-hidden="true">
          <defs>
            <!-- papel -->
            <linearGradient id="paper" x1="0.15" y1="0" x2="0.85" y2="1">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="0.5" stop-color="#f5f5f3" />
              <stop offset="1" stop-color="#e5e5e1" />
            </linearGradient>
            <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="0.72" stop-color="#f0f0ed" />
              <stop offset="1" stop-color="#dcdcd8" />
            </linearGradient>
            <linearGradient id="lowerFlap" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ececea" />
              <stop offset="1" stop-color="#dcdcd8" />
            </linearGradient>
            <linearGradient id="sideL" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#e6e6e3" />
              <stop offset="1" stop-color="#f4f4f2" />
            </linearGradient>
            <linearGradient id="sideR" x1="1" y1="0" x2="0" y2="0">
              <stop offset="0" stop-color="#e6e6e3" />
              <stop offset="1" stop-color="#f4f4f2" />
            </linearGradient>

            <!-- cera preta -->
            <radialGradient id="wax" cx="0.42" cy="0.32" r="0.78">
              <stop offset="0" stop-color="#3b3b3b" />
              <stop offset="0.45" stop-color="#1c1c1c" />
              <stop offset="0.82" stop-color="#0d0d0d" />
              <stop offset="1" stop-color="#050505" />
            </radialGradient>
            <radialGradient id="waxGloss" cx="0.38" cy="0.24" r="0.42">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.34" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>

            <!-- metal do pingente -->
            <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0.2">
              <stop offset="0" stop-color="#0a0a0a" />
              <stop offset="0.32" stop-color="#3d3d3d" />
              <stop offset="0.5" stop-color="#1a1a1a" />
              <stop offset="0.68" stop-color="#333333" />
              <stop offset="1" stop-color="#070707" />
            </linearGradient>

            <!-- sombra difusa sob o envelope -->
            <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="200%">
              <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#a9a9a4" flood-opacity="0.55" />
              <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#bdbdb8" flood-opacity="0.35" />
            </filter>

            <!-- sombra fina das dobras -->
            <filter id="foldSoft" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#b6b6b1" flood-opacity="0.5" />
            </filter>
            <filter id="sealShadow" x="-80%" y="-80%" width="260%" height="260%">
              <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#6f6f6a" flood-opacity="0.45" />
            </filter>
            <filter id="pendantShadow" x="-120%" y="-60%" width="340%" height="240%">
              <feDropShadow dx="0" dy="3" stdDeviation="2.6" flood-color="#8a8a85" flood-opacity="0.5" />
            </filter>

            <!-- grão de papel -->
            <filter id="grain" x="0" y="0" width="100%" height="100%">
              <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n" />
              <feColorMatrix in="n" type="saturate" values="0" />
              <feComponentTransfer><feFuncA type="linear" slope="0.05" /></feComponentTransfer>
            </filter>

            <clipPath id="bodyClip">
              <rect x="70" y="50" width="480" height="320" rx="5" />
            </clipPath>
          </defs>

          <!-- ================= ENVELOPE ================= -->
          <g id="envelope" filter="url(#dropShadow)">

            <!-- corpo -->
            <rect x="70" y="50" width="480" height="320" rx="5" fill="url(#paper)" />

            <!-- abas laterais e inferior (a composição em X) -->
            <g clip-path="url(#bodyClip)">
              <polygon points="70,370 310,210 70,210" fill="url(#sideL)" opacity="0.75" />
              <polygon points="550,370 310,210 550,210" fill="url(#sideR)" opacity="0.75" />
              <polygon points="70,370 550,370 310,210" fill="url(#lowerFlap)" />
            </g>

            <!-- grão sutil sobre o corpo -->
            <rect x="70" y="50" width="480" height="320" rx="5" filter="url(#grain)" opacity="0.6" />

            <!-- linhas das dobras: dos cantos ao centro (o X) -->
            <g class="folds" filter="url(#foldSoft)" stroke="#bdbdb7" stroke-width="1.2" fill="none" opacity="0.9">
              <line x1="70" y1="370" x2="310" y2="210" />
              <line x1="550" y1="370" x2="310" y2="210" />
            </g>

            <!-- aba superior triangular, dobrada para baixo -->
            <g id="topFlap" filter="url(#foldSoft)">
              <polygon points="70,50 550,50 310,224" fill="url(#flap)" />
              <polyline points="70,50 310,224 550,50" fill="none" stroke="#c2c2bc" stroke-width="1.2" opacity="0.9" />
            </g>

            <!-- contorno geral do envelope -->
            <rect x="70" y="50" width="480" height="320" rx="5" fill="none" stroke="#c4c4be" stroke-width="1.2" opacity="0.85" />
          </g>

          <!-- ================= SELO DE CERA ================= -->
          <g id="sealGroup" filter="url(#sealShadow)">
            <!-- borda irregular da cera -->
            <path id="sealBlob" fill="url(#wax)"
              d="M310 150
                 c26 -1 44 12 47 30 c4 15 -3 27 2 39 c5 12 -8 24 -26 27
                 c-16 3 -31 -2 -45 1 c-15 3 -29 -6 -33 -21 c-4 -13 1 -25 -3 -37
                 c-4 -13 6 -28 24 -33 c12 -4 22 -6 34 -6 Z" />
            <path d="M310 150 c26 -1 44 12 47 30 c4 15 -3 27 2 39 c5 12 -8 24 -26 27 c-16 3 -31 -2 -45 1 c-15 3 -29 -6 -33 -21 c-4 -13 1 -25 -3 -37 c-4 -13 6 -28 24 -33 c12 -4 22 -6 34 -6 Z"
              fill="url(#waxGloss)" />
            <!-- realce superior -->
            <ellipse cx="298" cy="176" rx="26" ry="14" fill="#ffffff" opacity="0.06" />
            <!-- estrela central -->
            <g transform="translate(310 210)">
              <svg x="-15" y="-20" width="30" height="40" viewBox="0 0 24 32">
                <use href="#star4" fill="#f2f2ef" />
              </svg>
            </g>
          </g>

          <!-- ================= PINGENTE ================= -->
          <g id="pendant" filter="url(#pendantShadow)" stroke="url(#metal)" fill="none"
             stroke-linecap="round" stroke-linejoin="round">
            <line x1="310" y1="262" x2="310" y2="286" stroke-width="2.2" />
            <path d="M310 286 c9 0 14 6 14 13 c0 6 -4 10 -9 11 l0 8 l-10 0 l0 -8 c-5 -1 -9 -5 -9 -11 c0 -7 5 -13 14 -13 Z"
              fill="url(#metal)" stroke="none" />
            <line x1="310" y1="318" x2="310" y2="336" stroke-width="1.8" />
            <path d="M310 340 l4 6 l-4 6 l-4 -6 Z" fill="url(#metal)" stroke="none" />
            <line x1="310" y1="352" x2="310" y2="366" stroke-width="1.4" opacity="0.9" />
          </g>
        </svg>
      </button>
    </div>

    <!-- convite para interação -->
    <p class="hint" id="hint">toque na carta para abrir<br />seu presente</p>

    <!-- divisor ornamental -->
    <div class="divider" aria-hidden="true">
      <span class="divider__line"></span>
      <svg class="divider__star" viewBox="0 0 24 32"><use href="#star4" /></svg>
      <span class="divider__line"></span>
    </div>

    <!-- ornamento inferior -->
    <div class="ornament ornament--bottom" aria-hidden="true">
      <span class="ornament__line"></span>
      <svg class="ornament__star" viewBox="0 0 24 32"><use href="#star4" /></svg>
      <span class="ornament__dot"></span>
    </div>

  </main>

  <!-- ================= PÁGINA BRANCA + PLAYER ================= -->
  <section class="whitepage" id="whitepage" aria-hidden="true">
    <div class="whitepage__inner" id="whitepageInner">

      <div class="panel panel--player">
      <!-- dois personagens apoiados no topo do card, olhando um para o outro -->
      <div class="couple" aria-hidden="true">
        <!-- menino (à esquerda, olhando para a direita) -->
        <svg class="couple__char couple__char--boy" viewBox="0 0 160 200">
          <defs>
            <linearGradient id="boyShirt" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3a3a42" />
              <stop offset="1" stop-color="#131316" />
            </linearGradient>
            <linearGradient id="boySkin" x1="0.3" y1="0" x2="0.8" y2="1">
              <stop offset="0" stop-color="#f8d8b6" />
              <stop offset="1" stop-color="#eec19a" />
            </linearGradient>
            <linearGradient id="boyHair" x1="0" y1="0" x2="0.2" y2="1">
              <stop offset="0" stop-color="#8d8d97" />
              <stop offset="0.45" stop-color="#5c5c66" />
              <stop offset="1" stop-color="#2a2a30" />
            </linearGradient>
            <radialGradient id="boyCheek" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#f28a97" stop-opacity="0.55" />
              <stop offset="1" stop-color="#f28a97" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- corpo (corpo menor que a cabeça) -->
          <path d="M46 200 C46 156 57 134 80 134 C103 134 114 156 114 200 Z" fill="url(#boyShirt)" />
          <!-- braços apoiados no card -->
          <g class="char__arm char__arm--r">
            <path d="M104 150 C120 162 123 182 118 200" fill="none" stroke="url(#boySkin)" stroke-width="13" stroke-linecap="round" />
          </g>
          <g class="char__arm char__arm--l">
            <path d="M56 150 C40 162 37 182 42 200" fill="none" stroke="url(#boySkin)" stroke-width="13" stroke-linecap="round" />
          </g>
          <!-- pescoço curto -->
          <rect x="72" y="118" width="16" height="22" rx="8" fill="#e7bd91" />
          <!-- cabeça (esfera grande) -->
          <circle cx="80" cy="72" r="54" fill="url(#boySkin)" />
          <!-- sombra suave na base da cabeça -->
          <path d="M40 92 Q80 128 120 92 Q80 112 40 92 Z" fill="#e2b183" opacity="0.35" />

          <!-- cabelo cacheado/ondulado, com gradiente cinza -->
          <path d="M26 58 A54 54 0 0 1 134 58 Q120 72 80 72 Q40 72 26 58 Z" fill="url(#boyHair)" />
          <g fill="url(#boyHair)">
            <circle cx="38" cy="56" r="14" />
            <circle cx="58" cy="44" r="15" />
            <circle cx="80" cy="40" r="15" />
            <circle cx="102" cy="44" r="15" />
            <circle cx="122" cy="56" r="14" />
          </g>
          <!-- ondinhas / cachos -->
          <g fill="none" stroke="#9a9aa6" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
            <path d="M30 46 q6 -6 12 0 q6 6 12 0" />
            <path d="M62 36 q6 -6 12 0 q6 6 12 0" />
            <path d="M94 42 q6 -6 12 0 q6 6 12 0" />
            <path d="M26 56 q5 -5 10 0" />
            <path d="M124 56 q5 -5 10 0" />
          </g>

          <!-- olhos enormes e baixos (olhando à direita) -->
          <ellipse cx="94" cy="88" rx="9" ry="12.5" fill="#2b2b30" />
          <ellipse cx="118" cy="88" rx="9" ry="12.5" fill="#2b2b30" />
          <circle cx="97" cy="83" r="3.6" fill="#ffffff" />
          <circle cx="121" cy="83" r="3.6" fill="#ffffff" />
          <circle cx="91.5" cy="93" r="1.7" fill="#ffffff" opacity="0.85" />
          <circle cx="115.5" cy="93" r="1.7" fill="#ffffff" opacity="0.85" />
          <!-- blush -->
          <ellipse cx="86" cy="103" rx="9" ry="5.5" fill="url(#boyCheek)" />
          <ellipse cx="128" cy="103" rx="9" ry="5.5" fill="url(#boyCheek)" />
          <!-- boquinha -->
          <path d="M100 105 q6 6 12 0" fill="none" stroke="#c07b62" stroke-width="2.6" stroke-linecap="round" />
        </svg>

        <!-- menina (à direita, olhando para a esquerda) -->
        <svg class="couple__char couple__char--girl" viewBox="0 0 160 200">
          <defs>
            <linearGradient id="girlDress" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#b487dd" />
              <stop offset="1" stop-color="#8a55bd" />
            </linearGradient>
            <linearGradient id="girlSkin" x1="0.3" y1="0" x2="0.8" y2="1">
              <stop offset="0" stop-color="#f8d8b6" />
              <stop offset="1" stop-color="#eec19a" />
            </linearGradient>
            <linearGradient id="girlHair" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#4a342a" />
              <stop offset="1" stop-color="#2f1f18" />
            </linearGradient>
            <radialGradient id="girlCheek" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#f28a97" stop-opacity="0.55" />
              <stop offset="1" stop-color="#f28a97" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- cabelo liso, comprido: bloco cheio cobrindo atrás da cabeça -->
          <path d="M24 72 A56 56 0 0 1 136 72 L136 152 Q80 172 24 152 Z" fill="url(#girlHair)" />
          <!-- mechas lisas -->
          <path d="M44 70 L44 150 M116 70 L116 150 M80 126 L80 164" fill="none" stroke="#5a4034" stroke-width="1.6" stroke-linecap="round" opacity="0.45" />

          <!-- vestido -->
          <path d="M80 134 C62 134 53 160 48 200 L112 200 C107 160 98 134 80 134 Z" fill="url(#girlDress)" />
          <!-- braços apoiados no card -->
          <g class="char__arm char__arm--l">
            <path d="M56 150 C40 162 37 182 42 200" fill="none" stroke="url(#girlSkin)" stroke-width="13" stroke-linecap="round" />
          </g>
          <g class="char__arm char__arm--r">
            <path d="M104 150 C120 162 123 182 118 200" fill="none" stroke="url(#girlSkin)" stroke-width="13" stroke-linecap="round" />
          </g>
          <!-- pescoço curto -->
          <rect x="72" y="118" width="16" height="22" rx="8" fill="#e7bd91" />
          <!-- cabeça (esfera grande) -->
          <circle cx="80" cy="72" r="54" fill="url(#girlSkin)" />
          <!-- sombra suave na base da cabeça -->
          <path d="M40 92 Q80 128 120 92 Q80 112 40 92 Z" fill="#e2b183" opacity="0.35" />

          <!-- franja -->
          <path d="M28 60 A54 54 0 0 1 132 60 Q120 74 80 74 Q40 74 28 60 Z" fill="url(#girlHair)" />
          <path d="M46 48 q16 -10 34 -5 q18 -3 30 8" fill="none" stroke="#5a4034" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />

          <!-- olhos enormes e baixos (olhando à esquerda) -->
          <ellipse cx="66" cy="88" rx="9" ry="12.5" fill="#33241d" />
          <ellipse cx="42" cy="88" rx="9" ry="12.5" fill="#33241d" />
          <circle cx="63" cy="83" r="3.6" fill="#ffffff" />
          <circle cx="39" cy="83" r="3.6" fill="#ffffff" />
          <circle cx="68.5" cy="93" r="1.7" fill="#ffffff" opacity="0.85" />
          <circle cx="44.5" cy="93" r="1.7" fill="#ffffff" opacity="0.85" />
          <!-- blush -->
          <ellipse cx="74" cy="103" rx="9" ry="5.5" fill="url(#girlCheek)" />
          <ellipse cx="32" cy="103" rx="9" ry="5.5" fill="url(#girlCheek)" />
          <!-- boquinha -->
          <path d="M48 105 q6 6 12 0" fill="none" stroke="#c07b62" stroke-width="2.6" stroke-linecap="round" />
        </svg>
      </div>

      <div class="player" id="player" role="group" aria-label="Reprodutor de música">

        <!-- capa -->
        <div class="player__art">
          <img class="player__cover" id="playerCover" src="photo.jpg" alt="" />
        </div>

        <!-- título + artista -->
        <div class="player__meta">
          <p class="player__title" id="playerTitle">here with me</p>
          <p class="player__artist" id="playerArtist">para você</p>
        </div>

        <!-- barra de progresso -->
        <div class="player__progress">
          <div class="player__track" id="playerTrack">
            <div class="player__fill" id="playerFill"></div>
          </div>
          <div class="player__times">
            <span class="player__time" id="playerCurrent">0:00</span>
            <span class="player__time" id="playerDuration">0:00</span>
          </div>
        </div>

        <!-- controles -->
        <div class="player__controls">
          <button class="player__nav" type="button" aria-label="Anterior" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18.5 6.2v11.6c0 .9-1 1.4-1.7.9l-9.3-5.8a1 1 0 0 1 0-1.8l9.3-5.8c.7-.5 1.7 0 1.7.9Z" fill="currentColor" stroke="none" />
              <rect x="5" y="5.5" width="1.8" height="13" rx="0.9" fill="currentColor" stroke="none" />
            </svg>
          </button>

          <button class="player__toggle" id="playerToggle" type="button" aria-label="Pausar" tabindex="-1">
            <svg class="player__icon player__icon--pause" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="7.6" y="5.5" width="3.2" height="13" rx="1" fill="currentColor" stroke="none" />
              <rect x="13.2" y="5.5" width="3.2" height="13" rx="1" fill="currentColor" stroke="none" />
            </svg>
            <svg class="player__icon player__icon--play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.7c0-.9 1-1.4 1.7-.9l9 5.5c.7.4.7 1.4 0 1.8l-9 5.5c-.7.5-1.7 0-1.7-.9V5.7Z" fill="currentColor" stroke="none" />
            </svg>
          </button>

          <button class="player__nav" type="button" aria-label="Próxima" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5.5 6.2v11.6c0 .9 1 1.4 1.7.9l9.3-5.8a1 1 0 0 0 0-1.8L7.2 5.3c-.7-.5-1.7 0-1.7.9Z" fill="currentColor" stroke="none" />
              <rect x="17.2" y="5.5" width="1.8" height="13" rx="0.9" fill="currentColor" stroke="none" />
            </svg>
          </button>
        </div>

      </div>
      </div>

      <!-- segunda tela: os nomes + cena dos personagens -->
      <div class="panel panel--names" id="namesPanel">
        <div class="names">
          <p class="names__name">Leo</p>

          <div class="names__stage" id="namesStage">
            <!-- coração grande que sobe atrás deles no final -->
            <svg class="stage__bigheart" viewBox="0 0 120 108" aria-hidden="true">
              <defs>
                <linearGradient id="nameHeart" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ff5f6d" />
                  <stop offset="0.5" stop-color="#e0245e" />
                  <stop offset="1" stop-color="#b0114a" />
                </linearGradient>
                <radialGradient id="nameHeartGlow" cx="0.5" cy="0.4" r="0.6">
                  <stop offset="0" stop-color="#ff8aa0" stop-opacity="0.75" />
                  <stop offset="1" stop-color="#ff8aa0" stop-opacity="0" />
                </radialGradient>
              </defs>
              <ellipse cx="60" cy="54" rx="58" ry="52" fill="url(#nameHeartGlow)" />
              <path d="M60 104 C18 76 6 52 6 34 C6 17 19 6 34 6 C45 6 54 12 60 22 C66 12 75 6 86 6 C101 6 114 17 114 34 C114 52 102 76 60 104 Z"
                fill="url(#nameHeart)" />
              <path d="M42 22 C33 22 27 29 27 38" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" opacity="0.6" />
            </svg>

            <!-- anel que o menino entrega -->
            <svg class="stage__ring" viewBox="0 0 44 44" aria-hidden="true">
              <ellipse cx="22" cy="27" rx="13" ry="13" fill="none" stroke="#f6c453" stroke-width="4.5" />
              <ellipse cx="22" cy="27" rx="13" ry="13" fill="none" stroke="#fff1c2" stroke-width="1.4" opacity="0.8" />
              <path d="M22 6 l4.5 6 l-4.5 5 l-4.5 -5 Z" fill="#8fd3ff" stroke="#ffffff" stroke-width="1" />
            </svg>

            <!-- mini corações que saem da cabeça dela -->
            <div class="sparks" aria-hidden="true">
              <svg class="spark spark--1" viewBox="0 0 24 22"><path d="M12 21C4 15 1 10 2 6c1-4 7-5 10 0 3-5 9-4 10 0 1 4-2 9-10 15Z" fill="#ff4d6d"/></svg>
              <svg class="spark spark--2" viewBox="0 0 24 22"><path d="M12 21C4 15 1 10 2 6c1-4 7-5 10 0 3-5 9-4 10 0 1 4-2 9-10 15Z" fill="#ff8fa3"/></svg>
