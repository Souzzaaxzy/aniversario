<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Uma cartinha especial guarda o seu presente." />
  <title>seu presente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- biblioteca de símbolos reutilizáveis -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <!-- estrela de quatro pontas: pontas verticais mais longas que as horizontais -->
      <symbol id="star4" viewBox="0 0 24 32">
        <path d="M12 0 Q12.6 15.4 24 16 Q12.6 16.6 12 32 Q11.4 16.6 0 16 Q11.4 15.4 12 0 Z" />
      </symbol>
    </defs>
  </svg>

  <main class="stage" id="stage">

    <!-- ornamento superior -->
    <div class="ornament ornament--top" aria-hidden="true">
      <span class="ornament__line"></span>
      <svg class="ornament__star" viewBox="0 0 24 32"><use href="#star4" /></svg>
      <span class="ornament__dot"></span>
    </div>

    <!-- cena principal -->
    <div class="scene" id="scene">
      <div class="glow" aria-hidden="true"></div>
      <div class="deco-field" id="decoField" aria-hidden="true"></div>

      <button class="letter" id="letter" type="button" aria-label="Toque na carta para abrir seu presente">
        <svg class="letter__svg" viewBox="60 25 500 385" role="img" aria-hidden="true">
          <defs>
            <!-- papel -->
            <linearGradient id="paper" x1="0.15" y1="0" x2="0.85" y2="1">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="0.5" stop-color="#f5f5f3" />
              <stop offset="1" stop-color="#e5e5e1" />
            </linearGradient>
            <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="0.72" stop-color="#f0f0ed" />
              <stop offset="1" stop-color="#dcdcd8" />
            </linearGradient>
            <linearGradient id="lowerFlap" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ececea" />
              <stop offset="1" stop-color="#dcdcd8" />
            </linearGradient>
            <linearGradient id="sideL" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#e6e6e3" />
              <stop offset="1" stop-color="#f4f4f2" />
            </linearGradient>
            <linearGradient id="sideR" x1="1" y1="0" x2="0" y2="0">
              <stop offset="0" stop-color="#e6e6e3" />
              <stop offset="1" stop-color="#f4f4f2" />
            </linearGradient>

            <!-- cera preta -->
            <radialGradient id="wax" cx="0.42" cy="0.32" r="0.78">
              <stop offset="0" stop-color="#3b3b3b" />
              <stop offset="0.45" stop-color="#1c1c1c" />
              <stop offset="0.82" stop-color="#0d0d0d" />
              <stop offset="1" stop-color="#050505" />
            </radialGradient>
            <radialGradient id="waxGloss" cx="0.38" cy="0.24" r="0.42">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.34" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>

            <!-- metal do pingente -->
            <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0.2">
              <stop offset="0" stop-color="#0a0a0a" />
              <stop offset="0.32" stop-color="#3d3d3d" />
              <stop offset="0.5" stop-color="#1a1a1a" />
              <stop offset="0.68" stop-color="#333333" />
              <stop offset="1" stop-color="#070707" />
            </linearGradient>

            <!-- sombra difusa sob o envelope -->
            <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="200%">
              <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#a9a9a4" flood-opacity="0.55" />
              <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#bdbdb8" flood-opacity="0.35" />
            </filter>

            <!-- sombra fina das dobras -->
            <filter id="foldSoft" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#b6b6b1" flood-opacity="0.5" />
            </filter>
            <filter id="sealShadow" x="-80%" y="-80%" width="260%" height="260%">
              <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#6f6f6a" flood-opacity="0.45" />
            </filter>
            <filter id="pendantShadow" x="-120%" y="-60%" width="340%" height="240%">
              <feDropShadow dx="0" dy="3" stdDeviation="2.6" flood-color="#8a8a85" flood-opacity="0.5" />
            </filter>

            <!-- grão de papel -->
            <filter id="grain" x="0" y="0" width="100%" height="100%">
              <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n" />
              <feColorMatrix in="n" type="saturate" values="0" />
              <feComponentTransfer><feFuncA type="linear" slope="0.05" /></feComponentTransfer>
            </filter>

            <clipPath id="bodyClip">
              <rect x="70" y="50" width="480" height="320" rx="5" />
            </clipPath>
          </defs>

          <!-- ================= ENVELOPE ================= -->
          <g id="envelope" filter="url(#dropShadow)">

            <!-- corpo -->
            <rect x="70" y="50" width="480" height="320" rx="5" fill="url(#paper)" />

            <!-- abas laterais e inferior (a composição em X) -->
            <g clip-path="url(#bodyClip)">
              <polygon points="70,370 310,210 70,210" fill="url(#sideL)" opacity="0.75" />
              <polygon points="550,370 310,210 550,210" fill="url(#sideR)" opacity="0.75" />
              <polygon points="70,370 550,370 310,210" fill="url(#lowerFlap)" />
            </g>

            <!-- grão sutil sobre o corpo -->
            <rect x="70" y="50" width="480" height="320" rx="5" filter="url(#grain)" opacity="0.6" />

            <!-- linhas das dobras: dos cantos ao centro (o X) -->
            <g class="folds" filter="url(#foldSoft)" stroke="#bdbdb7" stroke-width="1.2" fill="none" opacity="0.9">
              <line x1="70" y1="370" x2="310" y2="210" />
              <line x1="550" y1="370" x2="310" y2="210" />
            </g>

            <!-- aba superior triangular, dobrada para baixo -->
            <g id="topFlap" filter="url(#foldSoft)">
              <polygon points="70,50 550,50 310,224" fill="url(#flap)" />
              <polyline points="70,50 310,224 550,50" fill="none" stroke="#c2c2bc" stroke-width="1.2" opacity="0.9" />
            </g>

            <!-- contorno geral do envelope -->
            <rect x="70" y="50" width="480" height="320" rx="5" fill="none" stroke="#c4c4be" stroke-width="1.2" opacity="0.85" />
          </g>

          <!-- ================= SELO DE CERA ================= -->
          <g id="sealGroup" filter="url(#sealShadow)">
            <!-- borda irregular da cera -->
            <path id="sealBlob" fill="url(#wax)"
              d="M310 150
                 c26 -1 44 12 47 30 c4 15 -3 27 2 39 c5 12 -8 24 -26 27
                 c-16 3 -31 -2 -45 1 c-15 3 -29 -6 -33 -21 c-4 -13 1 -25 -3 -37
                 c-4 -13 6 -28 24 -33 c12 -4 22 -6 34 -6 Z" />
            <path d="M310 150 c26 -1 44 12 47 30 c4 15 -3 27 2 39 c5 12 -8 24 -26 27 c-16 3 -31 -2 -45 1 c-15 3 -29 -6 -33 -21 c-4 -13 1 -25 -3 -37 c-4 -13 6 -28 24 -33 c12 -4 22 -6 34 -6 Z"
              fill="url(#waxGloss)" />
            <!-- realce superior -->
            <ellipse cx="298" cy="176" rx="26" ry="14" fill="#ffffff" opacity="0.06" />
            <!-- estrela central -->
            <g transform="translate(310 210)">
              <svg x="-15" y="-20" width="30" height="40" viewBox="0 0 24 32">
                <use href="#star4" fill="#f2f2ef" />
              </svg>
            </g>
          </g>

          <!-- ================= PINGENTE ================= -->
          <g id="pendant" filter="url(#pendantShadow)" stroke="url(#metal)" fill="none"
             stroke-linecap="round" stroke-linejoin="round">
            <line x1="310" y1="262" x2="310" y2="286" stroke-width="2.2" />
            <path d="M310 286 c9 0 14 6 14 13 c0 6 -4 10 -9 11 l0 8 l-10 0 l0 -8 c-5 -1 -9 -5 -9 -11 c0 -7 5 -13 14 -13 Z"
              fill="url(#metal)" stroke="none" />
            <line x1="310" y1="318" x2="310" y2="336" stroke-width="1.8" />
            <path d="M310 340 l4 6 l-4 6 l-4 -6 Z" fill="url(#metal)" stroke="none" />
            <line x1="310" y1="352" x2="310" y2="366" stroke-width="1.4" opacity="0.9" />
          </g>
        </svg>
      </button>
    </div>

    <!-- convite para interação -->
    <p class="hint" id="hint">toque na carta para abrir<br />seu presente</p>

    <!-- divisor ornamental -->
    <div class="divider" aria-hidden="true">
      <span class="divider__line"></span>
      <svg class="divider__star" viewBox="0 0 24 32"><use href="#star4" /></svg>
      <span class="divider__line"></span>
    </div>

    <!-- ornamento inferior -->
    <div class="ornament ornament--bottom" aria-hidden="true">
      <span class="ornament__line"></span>
      <svg class="ornament__star" viewBox="0 0 24 32"><use href="#star4" /></svg>
      <span class="ornament__dot"></span>
    </div>

  </main>

  <!-- ================= PÁGINA BRANCA + PLAYER ================= -->
  <section class="whitepage" id="whitepage" aria-hidden="true">
    <div class="whitepage__inner" id="whitepageInner">

      <!-- dois personagens apoiados no topo do card, olhando um para o outro -->
      <div class="couple" aria-hidden="true">
        <!-- menino (à esquerda, olhando para a direita) -->
        <svg class="couple__char couple__char--boy" viewBox="0 0 140 176">
          <defs>
            <linearGradient id="boyShirt" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#33333a" />
              <stop offset="1" stop-color="#111114" />
            </linearGradient>
            <linearGradient id="boySkin" x1="0.3" y1="0" x2="0.75" y2="1">
              <stop offset="0" stop-color="#f7d2ac" />
              <stop offset="1" stop-color="#e8b689" />
            </linearGradient>
            <radialGradient id="boyCheek" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ef9d92" stop-opacity="0.5" />
              <stop offset="1" stop-color="#ef9d92" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- tronco (blusa sem gola) -->
          <path d="M38 176 C38 130 49 108 70 108 C91 108 102 130 102 176 Z" fill="url(#boyShirt)" />
          <!-- decote arredondado, sem gola -->
          <path d="M58 110 Q70 121 82 110" fill="none" stroke="#4a4a52" stroke-width="2.2" stroke-linecap="round" />
          <!-- braços apoiados no card -->
          <path d="M90 122 C108 137 113 156 109 176" fill="none" stroke="url(#boySkin)" stroke-width="12" stroke-linecap="round" />
          <path d="M50 122 C32 137 27 156 31 176" fill="none" stroke="url(#boySkin)" stroke-width="12" stroke-linecap="round" />
          <!-- pescoço -->
          <rect x="62" y="88" width="16" height="26" rx="8" fill="#e6b487" />
          <!-- cabeça -->
          <ellipse cx="70" cy="62" rx="33" ry="35" fill="url(#boySkin)" />
          <!-- sombra do queixo -->
          <path d="M54 80 Q70 96 86 80 Q70 90 54 80 Z" fill="#dda878" opacity="0.35" />

          <!-- cabelo ondulado / cacheado -->
          <path d="M36 58 C29 40 38 24 53 25 C59 16 79 16 87 25 C102 24 111 40 104 58
                   C101 46 93 42 85 45 C79 38 61 38 55 45 C47 42 39 46 36 58 Z" fill="#2b2b30" />
          <path d="M50 30 q7 -5 14 -2 q7 -4 14 1 q7 -2 12 4" fill="none" stroke="#4b4b54" stroke-width="1.8" stroke-linecap="round" />
          <circle cx="45" cy="40" r="7" fill="#2b2b30" />
          <circle cx="95" cy="40" r="7" fill="#2b2b30" />

          <!-- sobrancelhas -->
          <path d="M75 60 q5 -3 11 -1" fill="none" stroke="#3a3a42" stroke-width="2" stroke-linecap="round" />
          <path d="M89 59 q5 -2 11 -1" fill="none" stroke="#3a3a42" stroke-width="2" stroke-linecap="round" />
          <!-- olhos (pequenos, olhando à direita) -->
          <ellipse cx="80" cy="69" rx="3" ry="3.4" fill="#2b2b30" />
          <ellipse cx="95" cy="69" rx="3" ry="3.4" fill="#2b2b30" />
          <circle cx="81.1" cy="67.8" r="1" fill="#ffffff" />
          <circle cx="96.1" cy="67.8" r="1" fill="#ffffff" />
          <!-- nariz -->
          <path d="M85 76 q3 3 5 0" fill="none" stroke="#cf9a6c" stroke-width="1.5" stroke-linecap="round" />
          <!-- blush -->
          <circle cx="76" cy="80" r="7" fill="url(#boyCheek)" />
          <circle cx="99" cy="80" r="7" fill="url(#boyCheek)" />
          <!-- sorriso -->
          <path d="M82 81 q6 5 12 0" fill="none" stroke="#b9765a" stroke-width="2.4" stroke-linecap="round" />
        </svg>

        <!-- menina (à direita, olhando para a esquerda) -->
        <svg class="couple__char couple__char--girl" viewBox="0 0 140 176">
          <defs>
            <linearGradient id="girlDress" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#b487dd" />
              <stop offset="1" stop-color="#8a55bd" />
            </linearGradient>
            <linearGradient id="girlSkin" x1="0.3" y1="0" x2="0.75" y2="1">
              <stop offset="0" stop-color="#f7d2ac" />
              <stop offset="1" stop-color="#e8b689" />
            </linearGradient>
            <linearGradient id="girlHair" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3d2b23" />
              <stop offset="1" stop-color="#2c1d17" />
            </linearGradient>
            <radialGradient id="girlCheek" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#ef9d92" stop-opacity="0.5" />
              <stop offset="1" stop-color="#ef9d92" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- cabelo liso atrás e ao lado da cabeça -->
          <path d="M33 60 C33 26 107 26 107 60 L107 130 Q107 137 100 132 L100 76 Q100 58 70 58 Q40 58 40 76 L40 132 Q33 137 33 130 Z" fill="url(#girlHair)" />
          <!-- mechas lisas -->
          <path d="M45 56 L45 128 M95 56 L95 128" fill="none" stroke="#4a3229" stroke-width="1.6" stroke-linecap="round" opacity="0.6" />

          <!-- vestido -->
          <path d="M70 108 C54 108 45 137 39 176 L101 176 C95 137 86 108 70 108 Z" fill="url(#girlDress)" />
          <!-- braços apoiados no card -->
          <path d="M50 122 C32 137 27 156 31 176" fill="none" stroke="url(#girlSkin)" stroke-width="12" stroke-linecap="round" />
          <path d="M90 122 C108 137 113 156 109 176" fill="none" stroke="url(#girlSkin)" stroke-width="12" stroke-linecap="round" />
          <!-- pescoço -->
          <rect x="62" y="88" width="16" height="26" rx="8" fill="#e6b487" />
          <!-- cabeça -->
          <ellipse cx="70" cy="62" rx="33" ry="35" fill="url(#girlSkin)" />
          <!-- sombra do queixo -->
          <path d="M54 80 Q70 96 86 80 Q70 90 54 80 Z" fill="#dda878" opacity="0.35" />

          <!-- franja -->
          <path d="M37 60 A33 35 0 0 1 103 60 Q100 44 70 44 Q40 44 37 60 Z" fill="url(#girlHair)" />
          <path d="M52 40 q10 -6 20 -3 q10 -2 16 4" fill="none" stroke="#4a3229" stroke-width="1.6" stroke-linecap="round" opacity="0.7" />

          <!-- sobrancelhas -->
          <path d="M54 60 q6 -3 11 -1" fill="none" stroke="#3a2a22" stroke-width="2" stroke-linecap="round" />
          <path d="M70 59 q6 -2 11 -1" fill="none" stroke="#3a2a22" stroke-width="2" stroke-linecap="round" />
          <!-- olhos (pequenos, olhando à esquerda) -->
          <ellipse cx="60" cy="69" rx="3" ry="3.4" fill="#33241d" />
          <ellipse cx="45" cy="69" rx="3" ry="3.4" fill="#33241d" />
          <circle cx="58.9" cy="67.8" r="1" fill="#ffffff" />
          <circle cx="43.9" cy="67.8" r="1" fill="#ffffff" />
          <!-- nariz -->
          <path d="M52 76 q3 3 5 0" fill="none" stroke="#cf9a6c" stroke-width="1.5" stroke-linecap="round" />
          <!-- blush -->
          <circle cx="64" cy="80" r="7" fill="url(#girlCheek)" />
          <circle cx="41" cy="80" r="7" fill="url(#girlCheek)" />
          <!-- sorriso -->
          <path d="M45 81 q6 5 12 0" fill="none" stroke="#b9765a" stroke-width="2.4" stroke-linecap="round" />
        </svg>
      </div>

      <div class="player" id="player" role="group" aria-label="Reprodutor de música">

        <!-- capa -->
        <div class="player__art">
          <img class="player__cover" id="playerCover" src="photo.jpg" alt="" />
        </div>

        <!-- título + artista -->
        <div class="player__meta">
          <p class="player__title" id="playerTitle">here with me</p>
          <p class="player__artist" id="playerArtist">para você</p>
        </div>

        <!-- barra de progresso -->
        <div class="player__progress">
          <div class="player__track" id="playerTrack">
            <div class="player__fill" id="playerFill"></div>
          </div>
          <div class="player__times">
            <span class="player__time" id="playerCurrent">0:00</span>
            <span class="player__time" id="playerDuration">0:00</span>
          </div>
        </div>

        <!-- controles -->
        <div class="player__controls">
          <button class="player__nav" type="button" aria-label="Anterior" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18.5 6.2v11.6c0 .9-1 1.4-1.7.9l-9.3-5.8a1 1 0 0 1 0-1.8l9.3-5.8c.7-.5 1.7 0 1.7.9Z" fill="currentColor" stroke="none" />
              <rect x="5" y="5.5" width="1.8" height="13" rx="0.9" fill="currentColor" stroke="none" />
            </svg>
          </button>

          <button class="player__toggle" id="playerToggle" type="button" aria-label="Pausar" tabindex="-1">
            <svg class="player__icon player__icon--pause" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="7.6" y="5.5" width="3.2" height="13" rx="1" fill="currentColor" stroke="none" />
              <rect x="13.2" y="5.5" width="3.2" height="13" rx="1" fill="currentColor" stroke="none" />
            </svg>
            <svg class="player__icon player__icon--play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.7c0-.9 1-1.4 1.7-.9l9 5.5c.7.4.7 1.4 0 1.8l-9 5.5c-.7.5-1.7 0-1.7-.9V5.7Z" fill="currentColor" stroke="none" />
            </svg>
          </button>

          <button class="player__nav" type="button" aria-label="Próxima" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5.5 6.2v11.6c0 .9 1 1.4 1.7.9l9.3-5.8a1 1 0 0 0 0-1.8L7.2 5.3c-.7-.5-1.7 0-1.7.9Z" fill="currentColor" stroke="none" />
              <rect x="17.2" y="5.5" width="1.8" height="13" rx="0.9" fill="currentColor" stroke="none" />
            </svg>
          </button>
        </div>

      </div>

    </div>
  </section>

  <audio id="bgAudio" src="music.mp3" preload="metadata" loop></audio>

  <script src="script.js"></script>
</body>
</html>
